services:
  redis-pnode:
    image: redis:alpine
    container_name: redis-pnode
    networks:
      - beckn_network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  onix-bpp:
    image: fidedocker/onix-adapter:latest
    container_name: onix-bpp
    platform: linux/amd64
    networks:
      - beckn_network
    ports:
      - "8082:8082"
    environment:
      CONFIG_FILE: "/app/config/local-simple-bpp.yaml"
      OTEL_EXPORTER_OTLP_INSECURE: true
    volumes:
      - ./config:/app/config
    command: [ "./server", "--config=/app/config/local-simple-bpp.yaml" ]

  otel-collector-bpp:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector-bpp
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./config/otel-collector-bpp/config.yaml:/etc/otel/config.yaml:ro
    networks:
      - beckn_network
    restart: unless-stopped

networks:
  beckn_network:
    name: beckn_network
    driver: bridge
